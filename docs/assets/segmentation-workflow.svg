<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" role="img" aria-labelledby="title desc"><title id="title">CALMaR automatic lesion segmentation workflow</title><desc id="desc">A vertical workflow from supported images through preprocessing, segmentation, post-processing and automated quality control, followed by optional human review when available.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087f8c"/></marker><style>.bg{fill:#f4f8fa}.box{fill:white;stroke:#2a6476;stroke-width:3}.auto{fill:#e0f3f3;stroke:#087f8c;stroke-width:3}.optional{fill:#fff2df;stroke:#d7802a;stroke-width:3}.h{font:700 25px system-ui,sans-serif;fill:#102532}.lab{font:700 18px system-ui,sans-serif;fill:#173a50}.s{font:14px system-ui,sans-serif;fill:#486575}.arr{stroke:#087f8c;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="980" height="760" rx="18"/><text class="h" x="490" y="42" text-anchor="middle">Automatic lesion segmentation remains the complete primary path</text>
<g transform="translate(250,70)"><rect class="box" width="480" height="68" rx="14"/><text class="lab" x="240" y="30" text-anchor="middle">1 · Supported image inputs</text><text class="s" x="240" y="53" text-anchor="middle">modality, stroke stage and spatial metadata checked</text></g><path class="arr" d="M490 140v35"/>
<g transform="translate(250,178)"><rect class="box" width="480" height="68" rx="14"/><text class="lab" x="240" y="30" text-anchor="middle">2 · Required preprocessing</text><text class="s" x="240" y="53" text-anchor="middle">tool-specific preparation with provenance</text></g><path class="arr" d="M490 248v35"/>
<g transform="translate(250,286)"><rect class="box" width="480" height="68" rx="14"/><text class="lab" x="240" y="30" text-anchor="middle">3 · Segmentation algorithm</text><text class="s" x="240" y="53" text-anchor="middle">probability map or candidate mask</text></g><path class="arr" d="M490 356v35"/>
<g transform="translate(250,394)"><rect class="box" width="480" height="68" rx="14"/><text class="lab" x="240" y="30" text-anchor="middle">4 · Documented post-processing</text><text class="s" x="240" y="53" text-anchor="middle">thresholds, components, morphology and resampling</text></g><path class="arr" d="M490 464v35"/>
<g transform="translate(250,502)"><rect class="auto" width="480" height="88" rx="14"/><text class="lab" x="240" y="31" text-anchor="middle">5 · Automatic mask + automated QC</text><text class="s" x="240" y="55" text-anchor="middle">retain QC status, warnings, uncertainty and mask source</text><text class="s" x="240" y="76" text-anchor="middle">this output can continue downstream without a human mask</text></g>
<path class="arr" d="M490 592v38"/><path class="arr" d="M731 546h80v84"/>
<g transform="translate(230,634)"><rect class="auto" width="520" height="82" rx="14"/><text class="lab" x="260" y="32" text-anchor="middle">Qualified automatic result</text><text class="s" x="260" y="58" text-anchor="middle">ready for registration and downstream analyses</text></g>
<g transform="translate(765,634)"><rect class="optional" width="185" height="82" rx="14"/><text class="lab" x="92" y="28" text-anchor="middle">Optional review</text><text class="s" x="92" y="50" text-anchor="middle">accept or correct</text><text class="s" x="92" y="69" text-anchor="middle">when available</text></g>
</svg>
