<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Simplified acute and chronic ischaemic stroke appearances across MRI modalities</title>
  <desc id="desc">A two-row matrix compares schematic DWI, ADC, FLAIR and T1-weighted appearances in acute and chronic stroke.</desc>
  <defs><style>.bg{fill:#f4f8fa}.cell{fill:white;stroke:#bfd0d8;stroke-width:2}.h{font:700 25px system-ui,sans-serif;fill:#102532}.lab{font:700 19px system-ui,sans-serif;fill:#173a50}.note{font:14px system-ui,sans-serif;fill:#486575}.brain{fill:#87939b;stroke:#243944;stroke-width:4}.vent{fill:#202b32}.bright{fill:#fff;stroke:#e4572e;stroke-width:4}.dark{fill:#111820;stroke:#e4572e;stroke-width:4}.subtle{fill:#bac5ca;stroke:#e4572e;stroke-width:3;stroke-dasharray:5 4}.rim{fill:#17232b;stroke:#f2f6f8;stroke-width:7}</style></defs>
  <rect class="bg" width="1200" height="610" rx="20"/>
  <text class="h" x="600" y="42" text-anchor="middle">Stroke appearance changes with time and modality</text>
  <text class="lab" x="95" y="187" text-anchor="middle">Acute</text><text class="note" x="95" y="211" text-anchor="middle">hours–days</text>
  <text class="lab" x="95" y="435" text-anchor="middle">Chronic</text><text class="note" x="95" y="459" text-anchor="middle">months+</text>
  <g transform="translate(170,65)">
    <g><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">DWI</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="bright" d="M69 116 C51 132 61 161 84 162 C105 161 107 134 92 119 C84 111 76 110 69 116Z"/><text class="note" x="117" y="215" text-anchor="middle">restricted diffusion: bright</text></g>
    <g transform="translate(255,0)"><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">ADC</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="dark" d="M69 116 C51 132 61 161 84 162 C105 161 107 134 92 119 C84 111 76 110 69 116Z"/><text class="note" x="117" y="215" text-anchor="middle">true restriction: dark</text></g>
    <g transform="translate(510,0)"><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">FLAIR</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="subtle" d="M69 116 C51 132 61 161 84 162 C105 161 107 134 92 119 C84 111 76 110 69 116Z"/><text class="note" x="117" y="215" text-anchor="middle">may be subtle early</text></g>
    <g transform="translate(765,0)"><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">T1-weighted</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="subtle" d="M69 116 C51 132 61 161 84 162 C105 161 107 134 92 119 C84 111 76 110 69 116Z"/><text class="note" x="117" y="215" text-anchor="middle">often less conspicuous</text></g>
  </g>
  <g transform="translate(170,315)">
    <g><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">DWI</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="dark" d="M68 113 C48 134 61 168 88 164 C109 158 105 128 89 116 C81 109 74 108 68 113Z"/><text class="note" x="117" y="215" text-anchor="middle">no acute restriction</text></g>
    <g transform="translate(255,0)"><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">ADC</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="bright" d="M68 113 C48 134 61 168 88 164 C109 158 105 128 89 116 C81 109 74 108 68 113Z"/><text class="note" x="117" y="215" text-anchor="middle">facilitated diffusion: bright</text></g>
    <g transform="translate(510,0)"><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">FLAIR</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="rim" d="M68 113 C48 134 61 168 88 164 C109 158 105 128 89 116 C81 109 74 108 68 113Z"/><text class="note" x="117" y="208" text-anchor="middle">CSF-like cavity; gliotic rim</text></g>
    <g transform="translate(765,0)"><rect class="cell" width="235" height="230" rx="14"/><text class="lab" x="117" y="34" text-anchor="middle">T1-weighted</text><ellipse class="brain" cx="117" cy="132" rx="82" ry="66"/><path class="dark" d="M68 113 C48 134 61 168 88 164 C109 158 105 128 89 116 C81 109 74 108 68 113Z"/><text class="note" x="117" y="208" text-anchor="middle">tissue loss / dark cavity</text></g>
  </g>
  <text class="note" x="600" y="590" text-anchor="middle">Schematic tendencies only: exact appearance varies with timing, acquisition, lesion type and treatment.</text>
</svg>
