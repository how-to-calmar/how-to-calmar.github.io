<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 590" role="img" aria-labelledby="title desc">
  <title id="title">Distributed systems that support language</title>
  <desc id="desc">An original schematic connects a core left-lateralized language network with dorsal and ventral pathways, perceptual and motor systems, and broader cognitive systems.</desc>
  <defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087f8c"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d66b28"/></marker><style>.bg{fill:#f4f8fa}.brain{fill:#e4ebee;stroke:#294b5b;stroke-width:5}.core{fill:#bd2d5a}.per{fill:#2e86ab}.motor{fill:#d66b28}.cog{fill:#715aa3}.h{font:700 25px system-ui,sans-serif;fill:#102532}.lab{font:600 17px system-ui,sans-serif;fill:#173a50}.small{font:14px system-ui,sans-serif;fill:#486575}.dorsal{stroke:#087f8c;stroke-width:9;fill:none;marker-end:url(#a1)}.ventral{stroke:#d66b28;stroke-width:9;fill:none;marker-end:url(#a2)}</style></defs>
  <rect class="bg" width="1150" height="590" rx="20"/>
  <text class="h" x="575" y="45" text-anchor="middle">Language emerges from interacting systems</text>
  <path class="brain" d="M300 160 C365 80 560 70 720 135 C830 180 860 290 792 374 C750 425 674 448 586 436 C518 470 406 448 350 397 C279 380 236 310 258 239 C268 205 280 181 300 160Z"/>
  <ellipse class="core" cx="655" cy="208" rx="58" ry="35"/><ellipse class="core" cx="478" cy="315" rx="66" ry="38"/><ellipse class="core" cx="598" cy="348" rx="61" ry="34"/>
  <path class="dorsal" d="M620 190 C555 140 454 190 457 274"/><path class="ventral" d="M640 235 C621 286 597 307 555 327"/>
  <text class="lab" x="666" y="201">frontal</text><text class="lab" x="453" y="321">temporal</text><text class="lab" x="577" y="354">temporal</text>
  <text class="lab" x="470" y="150" fill="#087f8c">dorsal pathway</text><text class="small" x="450" y="170">sound–motor mapping</text>
  <text class="lab" x="682" y="300" fill="#d66b28">ventral pathway</text><text class="small" x="682" y="320">sound–meaning mapping</text>
  <rect x="35" y="185" width="170" height="88" rx="16" fill="#d8edf5" stroke="#2e86ab" stroke-width="3"/><text class="lab" x="120" y="220" text-anchor="middle">Perceptual systems</text><text class="small" x="120" y="245" text-anchor="middle">auditory · visual</text>
  <rect x="36" y="320" width="170" height="88" rx="16" fill="#fae6d8" stroke="#d66b28" stroke-width="3"/><text class="lab" x="121" y="355" text-anchor="middle">Motor systems</text><text class="small" x="121" y="380" text-anchor="middle">speech · writing · sign</text>
  <rect x="890" y="215" width="220" height="112" rx="16" fill="#e8e2f2" stroke="#715aa3" stroke-width="3"/><text class="lab" x="1000" y="250" text-anchor="middle">Broader cognition</text><text class="small" x="1000" y="276" text-anchor="middle">attention · memory</text><text class="small" x="1000" y="299" text-anchor="middle">social and world knowledge</text>
  <path d="M205 225 L346 260" stroke="#2e86ab" stroke-width="5"/><path d="M206 360 L355 345" stroke="#d66b28" stroke-width="5"/><path d="M785 285 L890 270" stroke="#715aa3" stroke-width="5"/>
  <rect x="318" y="488" width="515" height="62" rx="16" fill="#fff" stroke="#bd2d5a" stroke-width="3"/><text class="lab" x="575" y="515" text-anchor="middle">Core language-selective network</text><text class="small" x="575" y="538" text-anchor="middle">strongly interacting, left-lateralized in most people, variable across individuals</text>
</svg>
