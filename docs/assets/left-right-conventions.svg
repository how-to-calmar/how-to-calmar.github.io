<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Radiological and neurological display conventions</title><desc id="desc">Two axial brain displays show that patient left can appear on different sides of the screen depending on convention, while orientation metadata remains authoritative.</desc><defs><style>.bg{fill:#f4f8fa}.p{fill:white;stroke:#b9ccd6;stroke-width:2}.h{font:700 24px system-ui,sans-serif;fill:#102532}.lab{font:700 18px system-ui,sans-serif;fill:#173a50}.s{font:14px system-ui,sans-serif;fill:#486575}.L{font:800 36px system-ui,sans-serif;fill:#c53d4f}.R{font:800 36px system-ui,sans-serif;fill:#286f9b}.brain{fill:#aeb9bf;stroke:#263c49;stroke-width:5}.les{fill:#c53d4f}</style></defs><rect class="bg" width="1000" height="430" rx="18"/><text class="h" x="500" y="42" text-anchor="middle">Display convention can change where “left” appears on the screen</text>
<g transform="translate(45,75)"><rect class="p" width="420" height="285" rx="14"/><text class="lab" x="210" y="35" text-anchor="middle">Radiological convention</text><text class="L" x="350" y="105">L</text><text class="R" x="52" y="105">R</text><ellipse class="brain" cx="210" cy="160" rx="120" ry="82"/><path class="les" d="M277 133c-26 15-18 56 13 58 26 1 38-34 19-52-9-9-21-11-32-6Z"/><text class="s" x="210" y="260" text-anchor="middle">patient left appears on screen right</text></g>
<g transform="translate(535,75)"><rect class="p" width="420" height="285" rx="14"/><text class="lab" x="210" y="35" text-anchor="middle">Neurological convention</text><text class="L" x="52" y="105">L</text><text class="R" x="350" y="105">R</text><ellipse class="brain" cx="210" cy="160" rx="120" ry="82"/><path class="les" d="M111 133c-26 15-18 56 13 58 26 1 38-34 19-52-9-9-21-11-32-6Z"/><text class="s" x="210" y="260" text-anchor="middle">patient left appears on screen left</text></g>
<text class="s" x="500" y="402" text-anchor="middle">The L/R marker and affine/orientation metadata—not visual guesswork—identify anatomical side.</text></svg>
