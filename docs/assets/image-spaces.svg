<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" role="img" aria-labelledby="title desc"><title id="title">Image spaces used by CALMaR</title><desc id="desc">Four panels distinguish native, derived, template and atlas spaces and show transforms between them.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087f8c"/></marker><style>.bg{fill:#f4f8fa}.p{fill:white;stroke:#b9ccd6;stroke-width:2}.h{font:700 23px system-ui,sans-serif;fill:#102532}.lab{font:700 17px system-ui,sans-serif;fill:#173a50}.s{font:14px system-ui,sans-serif;fill:#486575}.brain{fill:#b8c4ca;stroke:#294b5b;stroke-width:4}.grid{stroke:#6e8793;stroke-width:1;opacity:.65}.a{stroke:#087f8c;stroke-width:4;fill:none;marker-end:url(#arr)}</style></defs><rect class="bg" width="1180" height="390" rx="18"/><text class="h" x="590" y="39" text-anchor="middle">A voxel only has anatomical meaning within a named space</text>
<g transform="translate(30,65)"><rect class="p" width="250" height="270" rx="14"/><text class="lab" x="125" y="32" text-anchor="middle">Native space</text><g transform="rotate(-8 125 125)"><ellipse class="brain" cx="125" cy="125" rx="76" ry="60"/><path d="M70 113c-15 18-1 45 24 37 18-6 16-31 1-40-9-5-18-4-25 3Z" fill="#d45252"/></g><text class="s" x="125" y="225" text-anchor="middle">acquired image geometry</text><text class="s" x="125" y="247" text-anchor="middle">person-specific orientation and grid</text></g>
<path class="a" d="M283 200L327 200"/><text class="s" x="305" y="183" text-anchor="middle">resample</text>
<g transform="translate(330,65)"><rect class="p" width="250" height="270" rx="14"/><text class="lab" x="125" y="32" text-anchor="middle">Derived space</text><ellipse class="brain" cx="125" cy="125" rx="76" ry="60"/><path d="M70 113c-15 18-1 45 24 37 18-6 16-31 1-40-9-5-18-4-25 3Z" fill="#d45252"/><path class="grid" d="M45 85h160M45 125h160M45 165h160M85 65v120M125 65v120M165 65v120"/><text class="s" x="125" y="225" text-anchor="middle">workflow-created destination grid</text><text class="s" x="125" y="247" text-anchor="middle">must name its source and transform</text></g>
<path class="a" d="M583 200L627 200"/><text class="s" x="605" y="183" text-anchor="middle">register</text>
<g transform="translate(630,65)"><rect class="p" width="250" height="270" rx="14"/><text class="lab" x="125" y="32" text-anchor="middle">Template space</text><ellipse class="brain" cx="125" cy="125" rx="76" ry="60"/><path class="grid" d="M45 85h160M45 125h160M45 165h160M85 65v120M125 65v120M165 65v120"/><text class="s" x="125" y="225" text-anchor="middle">standard reference anatomy</text><text class="s" x="125" y="247" text-anchor="middle">for example, a named MNI template</text></g>
<path class="a" d="M883 200L927 200"/><text class="s" x="905" y="183" text-anchor="middle">match</text>
<g transform="translate(930,65)"><rect class="p" width="220" height="270" rx="14"/><text class="lab" x="110" y="32" text-anchor="middle">Atlas space</text><ellipse class="brain" cx="110" cy="125" rx="76" ry="60"/><path d="M110 65v120M40 125h140" stroke="#fff" stroke-width="5"/><path d="M66 81L153 168M151 79L65 170" stroke="#087f8c" stroke-width="4"/><text class="s" x="110" y="225" text-anchor="middle">labels or probabilities</text><text class="s" x="110" y="247" text-anchor="middle">distributed on a specified grid</text></g>
<text class="s" x="590" y="370" text-anchor="middle">“MNI space” is not enough: template, resolution, orientation and grid still matter.</text></svg>
