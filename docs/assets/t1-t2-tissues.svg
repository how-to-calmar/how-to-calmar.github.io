<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Simplified T1- and T2-weighted brain tissue contrast</title>
  <desc id="desc">Two axial brain schematics compare grey matter, white matter and cerebrospinal fluid on T1- and T2-weighted MRI.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#173a50"/></marker>
    <style>
      .bg{fill:#f4f8fa}.panel{fill:white;stroke:#b9ccd6;stroke-width:2}.h{font:700 24px system-ui,sans-serif;fill:#102532}.t{font:600 17px system-ui,sans-serif;fill:#173a50}.s{font:14px system-ui,sans-serif;fill:#486575}.line{stroke:#173a50;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1100" height="480" rx="20"/>
  <rect class="panel" x="30" y="30" width="510" height="420" rx="16"/>
  <rect class="panel" x="560" y="30" width="510" height="420" rx="16"/>
  <text class="h" x="285" y="72" text-anchor="middle">T1-weighted</text>
  <text class="s" x="285" y="98" text-anchor="middle">white matter relatively bright; CSF dark</text>
  <ellipse cx="285" cy="270" rx="165" ry="135" fill="#777f87" stroke="#293640" stroke-width="6"/>
  <ellipse cx="285" cy="270" rx="125" ry="98" fill="#d9dde0"/>
  <path d="M254 247 C236 225 228 253 243 278 C254 294 269 279 272 263 C277 279 292 294 303 278 C318 253 310 225 292 247 C281 258 265 258 254 247Z" fill="#17232b"/>
  <path class="line" d="M115 152 L180 202"/><text class="t" x="62" y="148">Grey matter</text>
  <path class="line" d="M464 164 L382 222"/><text class="t" x="420" y="150">White matter</text>
  <path class="line" d="M455 356 L308 283"/><text class="t" x="430" y="382">CSF</text>
  <text class="h" x="815" y="72" text-anchor="middle">T2-weighted</text>
  <text class="s" x="815" y="98" text-anchor="middle">fluid bright; grey matter brighter than white matter</text>
  <ellipse cx="815" cy="270" rx="165" ry="135" fill="#c9d0d5" stroke="#293640" stroke-width="6"/>
  <ellipse cx="815" cy="270" rx="125" ry="98" fill="#737f88"/>
  <path d="M784 247 C766 225 758 253 773 278 C784 294 799 279 802 263 C807 279 822 294 833 278 C848 253 840 225 822 247 C811 258 795 258 784 247Z" fill="#f7fbfd" stroke="#b7c9d3"/>
  <path class="line" d="M640 152 L710 202"/><text class="t" x="590" y="148">Grey matter</text>
  <path class="line" d="M994 164 L912 222"/><text class="t" x="950" y="150">White matter</text>
  <path class="line" d="M985 356 L838 283"/><text class="t" x="960" y="382">CSF</text>
  <text class="s" x="550" y="438" text-anchor="middle">Relative signal is simplified and depends on acquisition and display settings.</text>
</svg>
