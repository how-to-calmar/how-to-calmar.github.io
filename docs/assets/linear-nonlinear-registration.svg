<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc"><title id="title">Linear and non-linear image registration</title><desc id="desc">A source brain is aligned to a target brain using global linear transformations or local non-linear deformation.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087f8c"/></marker><style>.bg{fill:#f4f8fa}.p{fill:white;stroke:#b9ccd6;stroke-width:2}.h{font:700 24px system-ui,sans-serif;fill:#102532}.lab{font:700 18px system-ui,sans-serif;fill:#173a50}.s{font:14px system-ui,sans-serif;fill:#486575}.brain{fill:#cad4d9;stroke:#294b5b;stroke-width:4}.grid{stroke:#6d8793;stroke-width:1.5;fill:none}.arr{stroke:#087f8c;stroke-width:4;marker-end:url(#a)}</style></defs><rect class="bg" width="1120" height="500" rx="18"/><text class="h" x="560" y="40" text-anchor="middle">Registration estimates a mapping; resampling applies it to a grid</text>
<g transform="translate(35,75)"><rect class="p" width="325" height="360" rx="14"/><text class="lab" x="162" y="34" text-anchor="middle">Source image</text><g transform="rotate(-10 162 170)"><ellipse class="brain" cx="162" cy="170" rx="102" ry="78"/><path class="grid" d="M67 130h190M67 170h190M67 210h190M112 94v152M162 92v156M212 94v152"/></g><text class="s" x="162" y="315" text-anchor="middle">different position, scale, angle</text><text class="s" x="162" y="338" text-anchor="middle">and possibly local anatomy</text></g>
<g transform="translate(397,75)"><rect class="p" width="325" height="360" rx="14"/><text class="lab" x="162" y="34" text-anchor="middle">Linear registration</text><ellipse class="brain" cx="162" cy="170" rx="102" ry="78"/><path class="grid" d="M67 130h190M67 170h190M67 210h190M112 94v152M162 92v156M212 94v152"/><text class="s" x="162" y="301" text-anchor="middle">rigid: translation + rotation</text><text class="s" x="162" y="324" text-anchor="middle">affine: also scale + shear</text><text class="s" x="162" y="347" text-anchor="middle">one global transform</text></g>
<g transform="translate(759,75)"><rect class="p" width="325" height="360" rx="14"/><text class="lab" x="162" y="34" text-anchor="middle">Non-linear registration</text><ellipse class="brain" cx="162" cy="170" rx="102" ry="78"/><path class="grid" d="M65 132c52-24 139-16 194 3M63 174c61-15 139 19 198-2M68 214c54 18 136-14 187-3M112 98c-15 47 13 102-5 146M163 93c20 50-18 103 2 155M214 98c-14 49 16 97-4 146"/><text class="s" x="162" y="301" text-anchor="middle">smooth local deformation field</text><text class="s" x="162" y="324" text-anchor="middle">can align finer anatomy</text><text class="s" x="162" y="347" text-anchor="middle">can also distort pathology</text></g>
<path class="arr" d="M360 255h32"/><path class="arr" d="M722 255h32"/><text class="s" x="560" y="474" text-anchor="middle">More flexibility is not automatically better: preserve the lesion, inspect the result and retain the transform chain.</text></svg>
