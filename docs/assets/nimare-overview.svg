<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">What NiMARE does</title><desc id="desc">An original schematic shows research coordinates or statistical images entering NiMARE estimators to produce meta-analytic maps, diagnostics and decoding results.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#087f8c"/></marker><style>.bg{fill:#f4f8fa}.b{fill:white;stroke:#2a6476;stroke-width:3}.mid{fill:#dff2f2;stroke:#087f8c;stroke-width:4}.h{font:700 24px system-ui,sans-serif;fill:#102532}.lab{font:700 17px system-ui,sans-serif;fill:#173a50}.s{font:14px system-ui,sans-serif;fill:#486575}.arr{stroke:#087f8c;stroke-width:4;marker-end:url(#a)}</style></defs><rect class="bg" width="1100" height="420" rx="18"/><text class="h" x="550" y="42" text-anchor="middle">NiMARE is a Python library for neuroimaging meta-analysis</text>
<g transform="translate(35,92)"><rect class="b" width="250" height="220" rx="15"/><text class="lab" x="125" y="35" text-anchor="middle">Research evidence</text><circle cx="73" cy="90" r="6" fill="#c43e52"/><circle cx="113" cy="76" r="6" fill="#c43e52"/><circle cx="150" cy="108" r="6" fill="#c43e52"/><circle cx="179" cy="83" r="6" fill="#c43e52"/><path d="M48 145h155M48 165h155M48 185h105" stroke="#8da1ab" stroke-width="8"/><text class="s" x="125" y="210" text-anchor="middle">coordinates, maps and metadata</text></g><path class="arr" d="M288 202h70"/>
<g transform="translate(362,75)"><rect class="mid" width="360" height="255" rx="18"/><text class="h" x="180" y="45" text-anchor="middle">NiMARE</text><rect x="55" y="76" width="250" height="42" rx="10" fill="white"/><text class="lab" x="180" y="103" text-anchor="middle">datasets + estimators</text><rect x="55" y="132" width="250" height="42" rx="10" fill="white"/><text class="lab" x="180" y="159" text-anchor="middle">correction + diagnostics</text><rect x="55" y="188" width="250" height="42" rx="10" fill="white"/><text class="lab" x="180" y="215" text-anchor="middle">decoders</text></g><path class="arr" d="M725 202h70"/>
<g transform="translate(799,92)"><rect class="b" width="266" height="220" rx="15"/><text class="lab" x="133" y="35" text-anchor="middle">Traceable results</text><ellipse cx="90" cy="107" rx="48" ry="36" fill="#9ca8ae"/><circle cx="72" cy="95" r="13" fill="#ffbd35"/><circle cx="110" cy="113" r="10" fill="#e24c5d"/><path d="M164 77h67M164 100h54M164 123h73M164 146h45" stroke="#687f8b" stroke-width="8"/><text class="s" x="133" y="188" text-anchor="middle">maps, scores, tables</text><text class="s" x="133" y="210" text-anchor="middle">and provenance</text></g><text class="s" x="550" y="384" text-anchor="middle">The output depends on the dataset, estimator, correction, decoder and versions selected by the analyst.</text></svg>
